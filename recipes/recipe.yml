---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: wolf-os
# description will be included in the image's metadata
description: Wolf OS - a hardened, rollback-safe everyday desktop with an isolated hacking lab.

# the base image to build on top of (FROM) and the version tag to use
# kinoite-main = Fedora Atomic KDE Plasma + Universal Blue extras (codecs, ujust, drivers)
base-image: ghcr.io/ublue-os/kinoite-main
image-version: 44 # pinned: moving to Fedora 45 is a deliberate change, not a surprise

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
        - distrobox # runs the Wolf Lab container (ujust lab)
        - jq # used by wolf-security-check
        - usbguard # off by default, turned on with ujust toggle-usbguard
        - gamemode # host daemon that Steam's gamemoderun talks to
    remove:
      packages:
        # removing firefox (in favor of the flatpak, which is sandboxed)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - firefox
        - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.mozilla.firefox
          - com.github.tchx84.Flatseal # see and change what each app is allowed to access
      - scope: user # Also add Flathub user repo, but no user packages

  - type: script
    scripts:
      - branding.sh
      - firewall.sh
      - fix-permissions.sh

  - type: justfiles
    include:
      - wolf.just

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
