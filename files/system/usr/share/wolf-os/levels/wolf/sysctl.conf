# Wolf OS security level: wolf (the default).
# Every level sets the same keys, so switching levels takes effect immediately.
# A leading "-" means: skip it quietly if this kernel or CPU doesn't have that setting.
-kernel.io_uring_disabled = 0
net.ipv4.icmp_echo_ignore_all = 0
-kernel.split_lock_mitigate = 1
kernel.sysrq = 16
net.ipv4.tcp_timestamps = 1
