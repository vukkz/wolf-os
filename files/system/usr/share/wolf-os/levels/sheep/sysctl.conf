# Wolf OS security level: sheep (maximum caution). On top of the wolf level:
# Turn off io_uring, a fast I/O interface with a long history of kernel exploits.
-kernel.io_uring_disabled = 2
# Don't answer pings, so the machine is harder to find on a network.
net.ipv4.icmp_echo_ignore_all = 1
-kernel.split_lock_mitigate = 1
# Disable the magic SysRq key (keyboard shortcuts straight into the kernel).
kernel.sysrq = 0
# Don't send TCP timestamps, which reveal uptime and help fingerprint the machine.
net.ipv4.tcp_timestamps = 0
