# Wolf OS network privacy. See SECURITY.md.

[device-wolf-privacy]
# Use a random MAC address while scanning for Wi-Fi networks
wifi.scan-rand-mac-address=yes

[connection-wolf-privacy]
# Each Wi-Fi network sees a different MAC address that stays the same for that
# network, so you can't be tracked across networks but captive portals and
# router reservations still work.
wifi.cloned-mac-address=stable
# Use temporary IPv6 addresses for outgoing connections
ipv6.ip6-privacy=2
