---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Wolf OS for AMD and Intel graphics (and VMs).
# image will be published to ghcr.io/<user>/<name>
name: wolf-os
# description will be included in the image's metadata
description: Wolf OS - a hardened, rollback-safe everyday desktop with an isolated hacking lab.

# the base image to build on top of (FROM) and the version tag to use
# kinoite-main = Fedora Atomic KDE Plasma + Universal Blue extras (codecs, ujust, drivers)
base-image: ghcr.io/ublue-os/kinoite-main
image-version: 44 # pinned: moving to Fedora 45 is a deliberate change, not a surprise

modules:
  - from-file: common-modules.yml
