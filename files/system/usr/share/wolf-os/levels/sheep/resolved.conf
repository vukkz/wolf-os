# Wolf OS security level: sheep. Every DNS lookup goes encrypted (DNS-over-TLS) to Quad9,
# a Swiss non-profit resolver that also blocks known malware domains. The network you're on
# can't see or change which sites you look up.
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
DNSOverTLS=yes
Domains=~.
FallbackDNS=
